{% extends 'home/base.html' %}
{% load static %}

{% block CONTENIDO %}
<section class="bg-light py-5 mt-5">
    <div class="container">
        <form method="GET" action="{% url 'vehiculo:comparar_vehiculos' %}" class="filtro-formulario animacion p-5 bg-white shadow rounded">
            <h2 class="text-center mb-4" style="color: #FF0000; font-weight: bold; font-size: 1.5rem;">Formulario de comparación</h2>
            <h6 class="text-center mb-5">Seleccione dos vehículos a comparar</h6>

            <div class="row justify-content-center mb-4">
                <div class="col-md-5 mb-4">
                    <select name="vehiculo_1" id="vehiculo_1" class="form-select">
                        <option value="">Vehiculo 1</option>
                        {% for vehiculo in vehiculos %}
                            <option value="{{ vehiculo.id }}">{{ vehiculo.modelo }} {{ vehiculo.version }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="col-md-5 mb-4">
                    <select name="vehiculo_2" id="vehiculo_2" class="form-select">
                        <option value="">Vehiculo 2</option>
                        {% for vehiculo in vehiculos %}
                            <option value="{{ vehiculo.id }}">{{ vehiculo.modelo }} {{ vehiculo.version }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Botón Limpiar filtros primero -->
            <div class="text-center mt-4 mb-4">
                <a href="{% url 'vehiculo:formulario_comparar' %}" class="btn btn-custom btn-custom-danger d-block mx-auto mb-3">Limpiar filtros</a>
            </div>

            <!-- Botón Comparar -->
            <div class="text-center mt-4">
                <button type="submit" class="btn btn-custom btn-custom-success mb-3">Comparar</button>
            </div>
        </form>
    </div>
</section>
{% endblock CONTENIDO %}
